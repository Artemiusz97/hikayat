<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="d20Bg" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#241a10" />
      <stop offset="65%" stop-color="#120e0a" />
      <stop offset="100%" stop-color="#080605" />
    </radialGradient>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <!-- Facet Gradients for 3D D20 Look -->
    <linearGradient id="facetTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="facetBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <filter id="goldGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Astrolabe Base -->
  <circle cx="32" cy="32" r="30" fill="url(#d20Bg)" stroke="url(#ringGold)" stroke-width="2" />
  
  <!-- Astrolabe Ring & Compass Ticks -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#78350f" stroke-width="0.75" stroke-dasharray="2 3" opacity="0.8" />
  <line x1="32" y1="3" x2="32" y2="7" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="32" y1="57" x2="32" y2="61" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="3" y1="32" x2="7" y2="32" stroke="#fbbf24" stroke-width="1.5" />
  <line x1="57" y1="32" x2="61" y2="32" stroke="#fbbf24" stroke-width="1.5" />

  <!-- D20 Polyhedron Outer Outline & Silhouette -->
  <!-- Top Vertex: (32, 11) -->
  <!-- Upper Left: (14, 21), Upper Right: (50, 21) -->
  <!-- Mid Left: (12, 38), Mid Right: (52, 38) -->
  <!-- Lower Left: (21, 50), Lower Right: (43, 50) -->
  <!-- Bottom Vertex: (32, 53) -->
  
  <!-- Outer D20 Shaded Facets -->
  <!-- Upper Left Triangle -->
  <polygon points="32,11 14,21 21,30" fill="#b45309" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Upper Right Triangle -->
  <polygon points="32,11 50,21 43,30" fill="#d97706" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  
  <!-- Far Left Outer Flange -->
  <polygon points="14,21 12,38 21,30" fill="#78350f" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Far Right Outer Flange -->
  <polygon points="50,21 52,38 43,30" fill="#92400e" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Lower Left Flange -->
  <polygon points="12,38 21,50 24,40" fill="#451a03" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Lower Right Flange -->
  <polygon points="52,38 43,50 40,40" fill="#78350f" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Bottom Center Triangle -->
  <polygon points="21,50 43,50 32,53" fill="#2d1204" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Mid-Lower Bridge Triangles -->
  <polygon points="21,30 24,40 32,36" fill="url(#facetLeft)" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="43,30 40,40 32,36" fill="url(#facetRight)" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="24,40 40,40 32,49" fill="url(#facetBottom)" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="24,40 32,49 21,50" fill="#381504" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>
  <polygon points="40,40 32,49 43,50" fill="#521d05" stroke="#fef08a" stroke-width="0.8" stroke-linejoin="round"/>

  <!-- Center Prime Triangle (Face "20" / Natural 20) -->
  <polygon points="32,11 21,30 43,30" fill="url(#facetTop)" stroke="#fff" stroke-width="1.2" stroke-linejoin="round" filter="url(#goldGlow)"/>

  <!-- Emblem on Prime Face: Stylized '20' or Hikayat Crest Crown -->
  <!-- Stylized Roman/Arabic Crown Rune -->
  <path d="M 27 27 L 32 17 L 37 27 L 34.5 25 L 32 28 L 29.5 25 Z" fill="#78350f" opacity="0.9" />
  <circle cx="32" cy="15.5" r="1.2" fill="#ffffff" />
</svg>
