<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="portalCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef08a" />
      <stop offset="55%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#0e0a12" />
    </radialGradient>
    <linearGradient id="portalGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="coreGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Base Shield -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#09070c" stroke="url(#portalGold)" stroke-width="2" />

  <!-- Outer Stone Gateway Arch / Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#78350f" stroke-width="4" />
  <circle cx="32" cy="32" r="22" fill="none" stroke="#d97706" stroke-width="1" />

  <!-- Portal Swirling Core -->
  <circle cx="32" cy="32" r="20" fill="url(#portalCore)" filter="url(#coreGlow)" opacity="0.95" />

  <!-- Gateway Rune Brackets (Cardinal Points) -->
  <rect x="30" y="6" width="4" height="4" rx="1" fill="#fef08a" />
  <rect x="30" y="54" width="4" height="4" rx="1" fill="#fef08a" />
  <rect x="6" y="30" width="4" height="4" rx="1" fill="#fef08a" />
  <rect x="54" y="30" width="4" height="4" rx="1" fill="#fef08a" />

  <!-- Upright Heraldic Adventure Sword / Blade Silhouette in the Gateway -->
  <!-- Blade -->
  <polygon points="32,15 34,38 30,38" fill="url(#bladeGrad)" stroke="#78350f" stroke-width="0.5" />
  <!-- Blade Fuller/Center Ridge -->
  <line x1="32" y1="17" x2="32" y2="38" stroke="#78350f" stroke-width="0.6" />
  <!-- Crossguard -->
  <path d="M 25 39 C 28 38 36 38 39 39 L 38 41 C 35 40 29 40 26 41 Z" fill="#b45309" stroke="#fef08a" stroke-width="0.6" />
  <!-- Hilt / Grip -->
  <line x1="32" y1="41" x2="32" y2="47" stroke="#78350f" stroke-width="2" stroke-linecap="round" />
  <!-- Pommel -->
  <circle cx="32" cy="49" r="2" fill="#fbbf24" stroke="#78350f" stroke-width="0.6" />

  <!-- Radiant Light Rays emanating from Portal Center -->
  <line x1="32" y1="20" x2="32" y2="12" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  <line x1="20" y1="32" x2="12" y2="32" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  <line x1="44" y1="32" x2="52" y2="32" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />
  <line x1="23" y1="23" x2="17" y2="17" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.8" />
  <line x1="41" y1="23" x2="47" y2="17" stroke="#fbbf24" stroke-width="1" stroke-linecap="round" opacity="0.8" />
</svg>
