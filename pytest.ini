[pytest]
addopts = --strict-markers -q --tb=short --maxfail=2 --durations=5
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning
    ignore::coverage.exceptions.CoverageWarning
pythonpath = .
markers =
    unit: Fast in-memory unit tests (data logic, schemas, pure functions)
    integration: Multi-component database and turn pipeline flows
    api: FastAPI REST endpoints and WebSocket tests
    contract: Static AST/codebase invariant and serialization integrity checks
    slow: Computationally heavy tests (simulations, campus directory generator)
